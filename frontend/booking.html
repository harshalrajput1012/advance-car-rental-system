<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Car - DriveEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">Drive<span>Ease</span></a>
            <ul class="navbar-nav">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="cars.html" class="nav-link">Cars</a></li>
                <li><a href="my-bookings.html" class="nav-link">My Bookings</a></li>
                <li><a href="profile.html" class="nav-link">Profile</a></li>
                <li><a href="login.html" class="btn btn-primary">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Booking Section -->
    <section class="section">
        <div class="container">
            <div class="grid grid-2">
                <!-- Car Summary -->
                <div>
                    <div class="card">
                        <div class="card-body">
                            <h2 class="card-title">Car Details</h2>
                            <div id="carSummary">
                                <!-- Car summary will be loaded dynamically -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Booking Form -->
                <div>
                    <div class="card">
                        <div class="card-body">
                            <h2 class="card-title">Booking Details</h2>
                            <div id="alertContainer"></div>
                            <form id="bookingForm">
                                <div class="form-group">
                                    <label class="form-label">Pickup Location</label>
                                    <input type="text" class="form-control" id="pickupLocation" placeholder="Enter pickup location" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Drop-off Location</label>
                                    <input type="text" class="form-control" id="dropoffLocation" placeholder="Enter drop-off location" required>
                                </div>
                                <div class="grid grid-2">
                                    <div class="form-group">
                                        <label class="form-label">Pickup Date & Time</label>
                                        <input type="datetime-local" class="form-control" id="pickupDate" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Return Date & Time</label>
                                        <input type="datetime-local" class="form-control" id="returnDate" required>
                                    </div>
                                </div>
                                <div class="card" style="background-color: var(--light-color); margin: 1rem 0;">
                                    <div class="card-body">
                                        <h3 class="card-title">Booking Summary</h3>
                                        <p><strong>Rental Days:</strong> <span id="rentalDays">0</span></p>
                                        <p><strong>Price per Day:</strong> ₹<span id="pricePerDay">0</span></p>
                                        <p><strong>Total Amount:</strong> ₹<span id="totalAmount" style="font-size: 1.5rem; color: var(--primary-color);">0</span></p>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Confirm Booking</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 DriveEase. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/booking.js"></script>
</body>
</html>
