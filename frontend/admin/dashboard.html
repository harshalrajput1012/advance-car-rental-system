<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DriveEase</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <!-- Admin Navigation -->
    <nav class="navbar admin-nav">
        <div class="container">
            <a href="../index.html" class="navbar-brand">Drive<span>Ease</span> Admin</a>
            <ul class="navbar-nav">
                <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
                <li><a href="manage-cars.html" class="nav-link">Manage Cars</a></li>
                <li><a href="manage-bookings.html" class="nav-link">Manage Bookings</a></li>
                <li><a href="manage-customers.html" class="nav-link">Manage Customers</a></li>
                <li><a href="#" class="btn btn-danger" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Dashboard Section -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">Admin Dashboard</h2>
            <div id="alertContainer"></div>
            
            <!-- Statistics Cards -->
            <div class="grid grid-4" id="statsCards">
                <!-- Stats will be loaded dynamically -->
            </div>

            <!-- Recent Bookings -->
            <div class="card" style="margin-top: 2rem;">
                <div class="card-body">
                    <h2 class="card-title">Recent Bookings</h2>
                    <div id="recentBookings">
                        <!-- Recent bookings will be loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 DriveEase. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
