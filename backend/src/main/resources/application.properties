# ============================================
# DriveEase - Car Rental Management System
# Application Configuration
# ============================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=driveease

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/driveease_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.driveease=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration (for frontend-backend communication)
# This will be configured in Java code instead
